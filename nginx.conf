events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  # Vidéos de cours et enregistrements de séances envoyés en fichier (jusqu'à 600 Mo)
  client_max_body_size 650m;

  server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://itecom-groupe-production.up.railway.app;
        # Envoi d'un gros enregistrement sur une connexion lente : ne pas couper au bout de 60 s
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_ssl_server_name on;
        proxy_set_header Host itecom-groupe-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass https://itecom-groupe-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host itecom-groupe-production.up.railway.app;
    }

    # Fichiers générés par le build (nom contenant un hash) : cache long, jamais remplacés par index.html.
    # Un fichier absent renvoie un vrai 404 au lieu de la page HTML (erreur « MIME type text/html »).
    location ~* ^/(main|chunk|polyfills|styles|scripts)-[A-Za-z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (et les routes de l'application) : toujours revalidé, pour charger la dernière version après un déploiement
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
  }
}

